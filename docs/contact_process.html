<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="8;url=https://mehedi.pro.bd/">
    <title>Message sent | Mehedi Hasan</title>
    <link rel="icon" type="image/png" sizes="96x96" href="./favicon/icon-96.png">
    <style>
        :root { --bg: #0b1120; --card: #111a2e; --ink: #e2e8f0; --ink-2: #94a3b8; --accent: #22d3ee; --ok: #10b981; }
        @media (prefers-color-scheme: light) { :root { --bg: #f8fafc; --card: #ffffff; --ink: #0f172a; --ink-2: #475569; --accent: #2563eb; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
            font: 16px/1.6 "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif; }
        .card { width: 100%; max-width: 440px; padding: 36px 28px; border-radius: 22px; text-align: center; background: var(--card);
            box-shadow: 0 0 0 1px rgba(148, 163, 184, .18), 0 24px 48px -24px rgba(0, 0, 0, .45); }
        .ok { width: 60px; height: 60px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 28px;
            background: linear-gradient(135deg, var(--ok), #059669); }
        h1 { margin: 0 0 8px; font-size: 1.35rem; }
        p { margin: 0 0 22px; color: var(--ink-2); }
        a.btn { display: inline-block; padding: 11px 22px; border-radius: 999px; font-weight: 600; text-decoration: none; color: #fff; background: var(--accent); }
        .small { margin: 16px 0 0; font-size: .85rem; }
        .small a { color: var(--accent); }
    </style>
</head>
<body>
    <main class="card" role="status">
        <div class="ok" aria-hidden="true">&#10003;</div>
        <h1>Thanks, your message is on its way.</h1>
        <p>I read every message myself and will reply by email soon.</p>
        <a class="btn" href="https://mehedi.pro.bd/">Back to the site</a>
        <p class="small">Urgent? <a href="https://wa.me/8801799447594">Message me on WhatsApp</a>.</p>
    </main>
</body>
</html>
