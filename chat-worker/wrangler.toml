name = "mehedi-chat"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# Only these sites may call the Worker (comma-separated, exact origins)
ALLOWED_ORIGINS = "https://mehedi.pro.bd,https://www.mehedi.pro.bd,http://localhost:8000"
# Built by scripts/build_knowledge.py and published with the site
KNOWLEDGE_URL = "https://mehedi.pro.bd/ai/knowledge.md"
# Any OpenAI-compatible API. Gemini today; for OmniRoute use e.g. "https://<your-omniroute-host>/v1"
LLM_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
LLM_MODEL = "gemini-flash-latest"
MAX_OUTPUT_TOKENS = "700"
# "none" skips Gemini's thinking step: faster, cheaper chat replies. Leave empty for providers without it.
REASONING_EFFORT = "none"
# the free-tier Gemini key (secret FREE_LLM_API_KEY, from a Google project with no billing) uses this model
FREE_LLM_MODEL = "gemini-flash-latest"
# Cloudflare's own model, tried last (free up to a daily allowance)
CF_AI_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
# The key is a secret, never put it here:  npx wrangler secret put LLM_API_KEY

# 12 questions per minute per visitor IP
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 12
  period = 60

[observability]
enabled = true

# Workers AI: Cloudflare's own models, the last fallback
[ai]
binding = "AI"
